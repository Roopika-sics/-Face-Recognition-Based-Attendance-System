{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Student Registration</title>
  </head>
  <body
    class="bg-gray-100 dark:bg-gray-900 flex items-center justify-center min-h-screen"
  >
    <div
      class="flex flex-col md:flex-row items-center bg-white rounded-lg shadow-md dark:border dark:bg-gray-800 dark:border-gray-700 p-8 space-y-6 md:space-y-0 md:space-x-8 max-w-4xl w-full"
    >
      <!-- Left Side SVG -->
      <div class="hidden md:flex justify-center items-center w-1/3">
        <img
          src="{% static 'svg/undraw_signup.svg' %}"
          alt="Student SVG"
          class="w-full h-auto"
        />
      </div>

      <!-- Form Section -->
      <div class="w-full md:w-2/3">
        <h1
          class="text-2xl font-extrabold text-white text-center tracking-wide drop-shadow-lg mt-[-10px] mb-8"
          style="font-family: 'Poppins', sans-serif"
        >
          Create an Account.
        </h1>

        <form
          class="grid grid-cols-1 md:grid-cols-2 gap-6"
          method="POST"
          enctype="multipart/form-data"
        >
          {% csrf_token %}

          <div class="space-y-4">
            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-900 dark:text-white"
                >Student Name</label
              >
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white p-2.5"
                required
              />
            </div>
            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-900 dark:text-white"
                >Your Email</label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="name@gmail.com"
                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white p-2.5"
                required
              />
            </div>
            <div>
              <label
                for="department"
                class="block text-sm font-medium text-gray-900 dark:text-white"
                >Department</label
              >
              <input
                type="text"
                id="department"
                name="department"
                placeholder="Computer Science"
                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white p-2.5"
                required
              />
            </div>
          </div>


          <div class="space-y-4">
            <div>
              <label
                for="photo"
                class="block text-sm font-medium text-gray-900 dark:text-white"
                >Upload Photo</label
              >
              <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white p-2.5"
              />
            </div>


            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-900 dark:text-white"
                >Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="••••••••"
                  class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white p-2.5"
                  required
                  oninput="showEyeIcon('password', 'eye-icon-1')"
                />
                <span
                  id="eye-icon-1"
                  class="absolute inset-y-0 right-3 flex items-center text-sm cursor-pointer hidden"
                  onclick="togglePassword('password')"
                >
                  👁️
                </span>
              </div>
            </div>

            <div>
              <label
                for="confirm-password"
                class="block text-sm font-medium text-gray-900 dark:text-white"
                >Confirm Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  placeholder="••••••••"
                  class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white p-2.5"
                  required
                  oninput="showEyeIcon('confirm-password', 'eye-icon-2')"
                />
                <span
                  id="eye-icon-2"
                  class="absolute inset-y-0 right-3 flex items-center text-sm cursor-pointer hidden"
                  onclick="togglePassword('confirm-password')"
                >
                  👁️
                </span>
              </div>
            </div>
          </div>

          <div class="col-span-1 md:col-span-2 flex flex-col items-center">
            <button
              type="submit"
              class="w-full md:w-1/2 text-white bg-blue-600 hover:bg-blue-500 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
            >
              Register
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function togglePassword(id) {
        const input = document.getElementById(id);
        if (input.type === "password") {
          input.type = "text";
        } else {
          input.type = "password";
        }
      }

      function showEyeIcon(inputId, eyeId) {
        const input = document.getElementById(inputId);
        const eyeIcon = document.getElementById(eyeId);

        if (input.value.length > 0) {
          eyeIcon.classList.remove("hidden");
        } else {
          eyeIcon.classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
