<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
</head>
<body class="bg-gray-100">

    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white shadow-lg rounded-lg p-8 max-w-lg w-full">
            <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">Edit Profile</h2>
            
            <form method="post" action="{% url 'edit_profile' %}" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700">Student Name</label>
                    <input type="text" name="name" value="{{ user.student_name }}" 
                        class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:border-blue-400">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Student ID</label>
                    <input type="email" name="student_id" value="{{ user.student_id }}" 
                        class="w-full px-4 py-2 border border-gray-300 rounded bg-gray-100 cursor-not-allowed" readonly>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Department</label>
                    <input type="text" name="department" value="{{ user.department }}" 
                        class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:border-blue-400">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="text" name="email" value="{{ user.email }}" 
                        class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400 focus:border-blue-400">
                </div>

                <!-- Save Button -->
                <div class="flex justify-center mt-6">
                    <button type="submit" 
                        class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-md shadow-md flex items-center transition-transform transform hover:scale-105">
                        <i class="ri-save-line mr-2"></i> Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
