<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Leave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
</head>
<body class="bg-gray-50">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-lg fixed h-full">
            <div class="p-4">
                <h1 class="text-2xl text-primary">DASHBOARD</h1>
            </div>
            <nav class="mt-8">
                <a href="{% url 'student_profile' student_id=request.user.id %}" class="flex items-center px-6 py-3 text-gray-700 bg-gray-100">
                    <div class="w-6 h-6 flex items-center justify-center">
                        <i class="ri-dashboard-line"></i>
                    </div>
                    <span class="mx-3">Personal Details</span>
                </a>
                <a href="{% url 'calendar' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                    <div class="w-6 h-6 flex items-center justify-center">
                        <i class="ri-calendar-line"></i>
                    </div>
                    <span class="mx-3">Calendar</span>
                </a>
                <a href="{% url 'apply_leave' %}" class="flex items-center px-6 py-3 text-gray-700 bg-gray-200">
                    <div class="w-6 h-6 flex items-center justify-center">
                        <i class="ri-time-line"></i>
                    </div>
                    <span class="mx-3">Apply Leave</span>
                </a>
                <a href="{% url 'leave_status' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                    <div class="w-6 h-6 flex items-center justify-center">
                        <i class="ri-file-chart-line"></i>
                    </div>
                    <span class="mx-3">Leave Status</span>
                </a>
            </nav>

            <div class="p-4">
                <a href="{% url 'student_login' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-red-100 rounded-lg">
                    <div class="w-6 h-6 flex items-center justify-center">
                        <i class="ri-logout-box-line text-red-500"></i>
                    </div>
                    <span class="mx-3 text-red-500 font-semibold">Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 p-6">
            <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-8 mt-10">
                <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Apply for Leave</h1>
                
                <form class="space-y-6" method="post" action="{% url 'apply_leave' %}">
                    {% csrf_token %}

                    <!-- Leave Duration -->
                    <div class="space-y-4">
                        <h2 class="text-xl font-semibold text-gray-700">Leave Duration</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                                <input type="date" name="start_date" required class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-primary focus:border-primary">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                                <input type="date" name="end_date" required class="w-full px-4 py-2 border border-gray-300 rounded focus:ring-2 focus:ring-primary focus:border-primary">
                            </div>
                        </div>
                    </div>

                    <!-- Leave Reason -->
                    <div class="space-y-4">
                        <h2 class="text-xl font-semibold text-gray-700">Leave Details</h2>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Reason for Leave</label>
                            <textarea name="reason" rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded"></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-center space-x-4 pt-4">
                        <button type="submit" class="px-6 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                            Submit Application
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
