<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales-all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex">

    <!-- Sidebar (from Profile Page) -->
    <aside class="w-64 bg-white shadow-lg fixed h-full">
        <div class="p-4">
            <h1 class="text-2xl text-primary">DASHBOARD</h1>
        </div>
        <nav class="mt-8">
            <a href="{% url 'student_profile' student.student.id %}" class="flex items-center px-6 py-3 text-gray-700 bg-gray-100">
                <div class="w-6 h-6 flex items-center justify-center">
                    <i class="ri-dashboard-line"></i>
                </div>
                <span class="mx-3">Personal Details</span>
            </a>
            <a href="{% url 'calendar' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                <div class="w-6 h-6 flex items-center justify-center">
                    <i class="ri-calendar-line"></i>
                </div>
                <span class="mx-3">Calendar</span>
            </a>
            <a href="{% url 'apply_leave' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                <div class="w-6 h-6 flex items-center justify-center">
                    <i class="ri-time-line"></i>
                </div>
                <span class="mx-3">Apply Leave</span>
            </a>
            <a href="{% url 'leave_status' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-gray-100">
                <div class="w-6 h-6 flex items-center justify-center">
                    <i class="ri-file-chart-line"></i>
                </div>
                <span class="mx-3">Leave Status</span>
            </a>
        </nav>

        <div class="p-4">
            <a href="{% url 'student_login' %}" class="flex items-center px-6 py-3 text-gray-700 hover:bg-red-100 rounded-lg">
                <div class="w-6 h-6 flex items-center justify-center">
                    <i class="ri-logout-box-line text-red-500"></i>
                </div>
                <span class="mx-3 text-red-500 font-semibold">Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content (Calendar) -->
    <main class="flex-1 ml-64 p-6">
        <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Student Calendar</h2>
            <div id="calendar"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                themeSystem: 'standard',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,multiMonthYear' 
                },
                views: {
                    multiMonthYear: {
                        type: 'multiMonth',
                        duration: { months: 12 },
                        buttonText: 'Year'
                    }
                },
                events: '/get-events/',
                eventColor: '#3b82f6',
                height: 'auto'
            });
            calendar.render();
        });
    </script>

</body>
</html>
