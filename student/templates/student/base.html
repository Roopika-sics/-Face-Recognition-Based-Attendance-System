<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Face Recognition System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header Section -->
    <header class="bg-gray-800 shadow-lg py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <h1 class="text-2xl font-bold tracking-wide text-white">Face Recognition System</h1>
        </div>
        <nav class="flex items-center space-x-6">
            <a href="{% url 'student_landing_page' %}" class="text-gray-300 hover:text-white transition">Home</a>
            <a href="{% url 'about' %}" class="text-gray-300 hover:text-white transition">About</a>
            <a href="{% url 'contact' %}" class="text-gray-300 hover:text-white transition">Contact</a>
            
            <!-- Dropdown Menu -->
            <div class="relative inline-block text-left">
                <button id="dropdownButton" class="bg-blue-600 px-4 py-2 rounded-lg shadow-md hover:bg-blue-500 transition">Login</button>
                <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-gray-800 border border-gray-700 rounded-md shadow-lg overflow-hidden">
                    <a href="{% url 'admin_login' %}" class="block px-4 py-2 text-white hover:bg-gray-700 transition">Admin Login</a>
                    <a href="{% url 'student_login' %}" class="block px-4 py-2 text-white hover:bg-gray-700 transition">Student Login</a>
                    <a href="{% url 'faculty_login' %}" class="block px-4 py-2 text-white hover:bg-gray-700 transition">Faculty Login</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Page Content -->
    <main class="container mx-auto px-6 py-12">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-center py-8 mt-10 border-t border-gray-700">
        <div class="container mx-auto">
            <p class="text-gray-500">&copy; 2025 Face Recognition System. All rights reserved.</p>
            <p class="text-gray-500">Designed using AI & Machine Learning</p>
        </div>
    </footer>

    <script>
        document.getElementById('dropdownButton').addEventListener('click', function() {
            document.getElementById('dropdownMenu').classList.toggle('hidden');
        });
    </script>

</body>
</html>
