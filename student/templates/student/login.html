<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900 text-white">
    <section class="h-screen flex items-center justify-center">
      <div class="container px-6 py-12">
        <div
          class="flex flex-wrap items-center justify-center lg:justify-between"
        >
          <!-- Left column with image -->
          <div class="hidden md:block md:w-6/12 lg:w-5/12">
            <img
              src="https://tecdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
              class="w-full"
              alt="Sign up image"
            />
          </div>

          <!-- Right column with form -->
          <div class="md:w-8/12 lg:ms-6 lg:w-5/12">
            <h2 class="text-3xl font-bold text-center mb-6 text-white-500">
              Sign In
            </h2>

            <form method="post" action="{% url 'student_login' %}">
              {% csrf_token %} 
              
              {% if messages %}
              <div class="mb-4">
                {% for message in messages %}
                <p
                  id="success-message"
                  class="p-3 rounded-lg text-center {% if message.tags == 'success' %} bg-green-500 text-white {% elif message.tags == 'error' %} bg-red-500 text-white {% endif %}"
                >
                  {{ message }}
                </p>
                {% endfor %}
              </div>
              {% endif %}

              
              <!-- Email input -->
              <div class="relative mb-6">
                <label for="student_id" class="block text-gray-400"
                  >Student ID</label
                >
                <input
                  type="text"
                  id="student_id"
                  name="student_id"
                  placeholder="Enter your Student ID"
                  class="w-full px-4 py-2 mt-1 rounded bg-gray-800 text-white border border-gray-600 focus:border-yellow-500 focus:outline-none"
                  required
                />
              </div>

              <!-- Password input -->
              <div class="relative mb-6">
                <label for="password" class="block text-gray-400"
                  >Password</label
                >
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  class="w-full px-4 py-2 mt-1 rounded bg-gray-800 text-white border border-gray-600 focus:border-yellow-500 focus:outline-none"
                  required
                />
              </div>

              <!-- Sign Up button -->
              <button
                type="submit"
                class="w-full px-4 py-2 rounded bg-blue-500 text-black font-semibold hover:bg-blue-600 transition duration-200"
              >
                Login
              </button>

              <p
                class="text-sm text-gray-500 dark:text-gray-400 text-center mt-3"
              >
                Don't have an account?
                <a
                  href="{% url 'student_registration' %}"
                  class="text-blue-600 hover:underline dark:text-yellow-500"
                  >Register here</a
                >
              </p>

              <p
                class="text-sm text-gray-500 dark:text-gray-400 text-center mt-3"
              >
                Forgot your password?
                <a
                  href="{% url 'forgot-password' %}"
                  class="text-blue-600 hover:underline dark:text-blue-500"
                  >Forgot password</a
                >
              </p>
            </form>
          </div>
        </div>
      </div>
    </section>
    <script>
      setTimeout(function () {
        let messageBox = document.getElementById("success-message");
        if (messageBox) {
          messageBox.style.transition = "opacity 0.5s ease";
          messageBox.style.opacity = "0";
          setTimeout(() => messageBox.remove(), 500);
        }
      }, 1000);
    </script>
  </body>
</html>
