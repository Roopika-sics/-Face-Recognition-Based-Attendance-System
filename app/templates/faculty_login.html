<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      :where([class^="ri-"])::before {
        content: "\f3c2";
      }
      input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 1rem;
        height: 1rem;
        border: 1px solid #d1d5db;
        border-radius: 0.25rem;
        background-color: #fff;
        cursor: pointer;
        position: relative;
      }
      input[type="checkbox"]:checked {
        background-color: #4f46e5;
        border-color: #4f46e5;
      }
      input[type="checkbox"]:checked::after {
        content: "";
        position: absolute;
        left: 5px;
        top: 2px;
        width: 4px;
        height: 8px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4F46E5",
              secondary: "#6B7280",
            },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[#f8fafc] flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-semibold text-gray-800">Faculty Login</h2>
      </div>

      {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
        <p
          id="success-message"
          class="p-3 rounded-lg text-center {% if message.tags == 'success' %} bg-green-500 text-white {% elif message.tags == 'error' %} bg-red-500 text-white {% endif %}"
        >
          {{ message }}
        </p>
        {% endfor %}
      </div>
      {% endif %}


      <div class="bg-white rounded-lg shadow-[0_4px_12px_rgba(0,0,0,0.1)] p-8">
        <form method="POST" action="{% url 'faculty_login' %}" class="space-y-6">
            {% csrf_token %}
          <div>
            <label
              for="username"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Faculty ID</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none w-5 h-5"
              >
                <i class="ri-user-line text-gray-400 mt-6"></i>
              </div>
              <input
                type="text"
                name="faculty_id"
                id="faculty_id"
                required
                class="block w-full pl-10 pr-3 py-2.5 text-sm border border-gray-200 rounded-button focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder:text-gray-400"
                placeholder="Enter your Faculty ID"
              />
            </div>
          </div>
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Password</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none w-5 h-5"
              >
                <i class="ri-lock-line text-gray-400 mt-6"></i>
              </div>
              <input
                type="password"
                name="password"
                id="password"
                required
                class="block w-full pl-10 pr-3 py-2.5 text-sm border border-gray-200 rounded-button focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder:text-gray-400"
                placeholder="Enter your password"
              />
            </div>
          </div>
          <div class="flex items-center justify-between"></div>
          <button
            type="submit"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-button text-sm font-medium text-white bg-primary hover:bg-primary/90 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary whitespace-nowrap"
          >
            Sign in
          </button>
        </form>
      </div>
    </div>
    <script>
      setTimeout(function () {
        let messageBox = document.getElementById("success-message");
        if (messageBox) {
          messageBox.style.transition = "opacity 0.5s ease";
          messageBox.style.opacity = "0";
          setTimeout(() => messageBox.remove(), 500);
        }
      }, 1000);
    </script>
  </body>
</html>
