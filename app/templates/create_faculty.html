<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Faculty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      :where([class^="ri-"])::before {
        content: "\f3c2";
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4f46e5",
              secondary: "#6366f1",
            },
            borderRadius: {
              button: "8px",
            },
          },
        },
      };

      function validatePassword() {
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirm_password").value;
        const errorText = document.getElementById("passwordError");

        if (password !== confirmPassword) {
          errorText.textContent = "Passwords do not match!";
          errorText.classList.remove("hidden");
          return false;
        } else {
          errorText.classList.add("hidden");
          return true;
        }
      }
    </script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 mt-12">
      <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg p-8">
        <div class="text-center mb-8">
          <h2 class="text-2xl font-semibold text-gray-800">
            Faculty Registration
          </h2>
        </div>

        {% if messages %}
        <div class="mb-4">
          {% for message in messages %}
          <p
            id="success-message"
            class="p-3 rounded-lg text-center {% if message.tags == 'success' %} bg-green-500 text-white {% elif message.tags == 'error' %} bg-red-500 text-white {% endif %}"
          >
            {{ message }}
          </p>
          {% endfor %}
        </div>
        {% endif %}

        <form
          method="POST"
          action="{% url 'create_faculty' %}"
          class="space-y-6"
        >
          {% csrf_token %}
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Faculty ID</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <i class="ri-user-line text-gray-400"></i>
              </div>
              <input
                type="text"
                id="faculty_id"
                name="faculty_id"
                class="pl-10 w-full h-10 border border-gray-300 rounded-button"
                placeholder="Enter Faculty ID"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Email</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <i class="ri-mail-line text-gray-400"></i>
              </div>
              <input
                type="email"
                id="email"
                name="email"
                class="pl-10 w-full h-10 border border-gray-300 rounded-button"
                placeholder="Enter your email"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Password</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <i class="ri-lock-line text-gray-400"></i>
              </div>
              <input
                type="password"
                id="password"
                name="password"
                class="pl-10 pr-10 w-full h-10 border border-gray-300 rounded-button"
                placeholder="Create a strong password"
                required
              />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Confirm Password</label
            >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <i class="ri-lock-line text-gray-400"></i>
              </div>
              <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                class="pl-10 pr-10 w-full h-10 border border-gray-300 rounded-button"
                placeholder="Confirm your password"
                required
              />
            </div>
          </div>

          <div class="flex space-x-4">
            <button
              type="submit"
              class="flex-1 bg-primary hover:bg-secondary text-white font-semibold py-2 px-4 rounded-button transition duration-200 cursor-pointer"
            >
              Create
            </button>
          </div>

          <p class="text-center text-sm text-gray-600">
            Already have an account?
            <a
              href="{% url 'faculty_login' %}"
              class="text-primary hover:text-secondary font-medium"
              >Sign in</a
            >
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
