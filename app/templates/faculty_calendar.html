<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  </head>
  <body class="bg-gray-100 flex">
    <main class="flex-1 p-6">
      <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-2xl p-6">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">
          Faculty Calendar
        </h2>

        <!-- Add Event Button (Redirects to Add Event Page) -->
        <div class="flex justify-start mb-2">
          <a
            href="{% url 'add_event' %}"
            class="px-4 py-2 bg-blue-500 text-white rounded-md shadow-md transform -translate-y-4"
          >
            + Add Event
          </a>
        </div>

        <div id="calendar"></div>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var calendarEl = document.getElementById("calendar");
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: "dayGridMonth",
          themeSystem: "standard",
          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,timeGridWeek,multiMonthYear",
          },
          views: {
            multiMonthYear: {
              type: "multiMonth",
              duration: { months: 12 },
              buttonText: "Year",
            },
          },
          events: "/app/get_events/",
          eventClick: function (info) {
            if (confirm("Do you want to delete this event?")) {
              fetch(`/delete_event/${info.event.id}/`, {
                method: "DELETE",
                headers: {
                  "X-CSRFToken": getCSRFToken(),
                },
              })
                .then((response) => response.json())
                .then((data) => {
                  console.log("Delete response:", data);
                  calendar.refetchEvents();
                })
                .catch((error) =>
                  console.error("Error deleting event:", error)
                );
            }
          },
          eventDidMount: function (info) {
            console.log(
              "Event loaded:",
              info.event.title,
              "Color:",
              info.event.backgroundColor
            );
          },
        });

        calendar.render();
      });
    </script>
  </body>
</html>
