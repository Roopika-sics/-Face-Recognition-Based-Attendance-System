<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#4F46E5",
              secondary: "#6B7280",
            },
            borderRadius: {
              none: "0px",
              sm: "4px",
              DEFAULT: "8px",
              md: "12px",
              lg: "16px",
              xl: "20px",
              "2xl": "24px",
              "3xl": "32px",
              full: "9999px",
              button: "8px",
            },
          },
        },
      };
    </script>
    <style>
      :where([class^="ri-"])::before {
        content: "\f3c2";
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
      <div class="flex items-center mb-8">
        <nav class="ml-auto">
          <ol class="flex items-center space-x-2 text-sm">
            <li>
              <a href="#" class="text-gray-600 hover:text-primary">Dashboard</a>
            </li>
            <li><i class="ri-arrow-right-s-line text-gray-400"></i></li>
            <li>
              <a href="#" class="text-gray-600 hover:text-primary">Students</a>
            </li>
            <li><i class="ri-arrow-right-s-line text-gray-400"></i></li>
            <li class="text-primary">Student Details</li>
          </ol>
        </nav>
      </div>
      <div class="bg-white rounded-lg shadow-sm p-8">
        <h1 class="text-2xl font-semibold text-gray-900 mb-8 text-center">
          Student Details
        </h1>
        <div class="flex justify-center mb-8">
          <div class="w-32 h-32 rounded-full bg-gray-200 overflow-hidden">
            <img
              src="{{student.photo.url}}"
              alt="Student Photo"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
        <div class="grid grid-cols-1 gap-6 max-w-2xl mx-auto">
          <div class="flex border-b border-gray-100 py-4">
            <span class="text-gray-600 w-1/3">Student ID</span>
            <span class="text-gray-900 w-2/3">{{student.student_id}}</span>
          </div>
          <div class="flex border-b border-gray-100 py-4">
            <span class="text-gray-600 w-1/3">Student Name</span>
            <span class="text-gray-900 w-2/3">{{student.student_name}}</span>
          </div>
          <div class="flex border-b border-gray-100 py-4">
            <span class="text-gray-600 w-1/3">Email Address</span>
            <span class="text-gray-900 w-2/3">{{student.email}}</span>
          </div>
          <div class="flex border-b border-gray-100 py-4">
            <span class="text-gray-600 w-1/3">Department</span>
            <span class="text-gray-900 w-2/3">{{student.department}}</span>
          </div>
        </div>
        <div class="flex justify-center mt-8">
          <a
            href="{% url 'student_list' %}"
            class="px-6 py-2 border border-gray-200 rounded-button text-gray-700 hover:bg-gray-50 transition-colors cursor-pointer whitespace-nowrap"
          >
            Back to List
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
