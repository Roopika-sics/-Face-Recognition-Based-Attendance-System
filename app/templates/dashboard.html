<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: #f4f6f9;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .sidebar {
            height: 100vh;
            background: #343a40;
            color: white;
            padding: 20px;
            position: fixed;
            width: 250px;
            transition: 0.3s;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: #495057;
        }
        .content {
            margin-left: 260px;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .logout-btn {
            position: absolute;
            bottom: 20px;
            width: 85%;
        }
        .dark-mode {
            background: #222 !important;
            color: #fff !important;
        }
        .dark-mode .sidebar {
            background: #111 !important;
        }
        .dark-mode .content {
            background: #181818 !important;
        }
        .dark-mode .card {
            background: #333 !important;
            color: white !important;
            box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.1);
        }
        .toggle-container {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    
    <div class="sidebar">
        <h3>Admin Dashboard</h3>
        <a href="{% url 'student_list' %}">📚 Manage Students</a>
        <a href="{% url 'faculty_list' %}">📚 Manage Faculty</a>
        <a href="#">📊 Attendance</a>
        <a href="#">📝 Leave</a>
        <a href="#">📅 Calendar</a>
        <a href="#">🏆 Rewards</a>
        <a href="#">📑 Reports</a>
        
        <!-- Dark Mode Toggle -->
        <div class="toggle-container">
            <button id="darkModeToggle" class="btn btn-sm btn-outline-light">🌙 Dark Mode</button>
        </div>

        <!-- Logout Button -->
        <a href="{% url 'admin_logout' %}" class="btn btn-danger logout-btn">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h2>Welcome, Admin!</h2>
        <p>Here is a quick overview of your dashboard.</p>

        <!-- Dashboard Cards -->
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>📚 Students</h5>
                    <p>Manage student details.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>📊 Attendance</h5>
                    <p>View and manage attendance records.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>🏆 Rewards</h5>
                    <p>Check and assign rewards.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dark Mode Script -->
    <script>
        const darkModeToggle = document.getElementById("darkModeToggle");
        const body = document.body;
        
        // Check if dark mode is already enabled
        if (localStorage.getItem("darkMode") === "enabled") {
            body.classList.add("dark-mode");
            darkModeToggle.textContent = "☀️ Light Mode";
        }

        darkModeToggle.addEventListener("click", () => {
            body.classList.toggle("dark-mode");

            if (body.classList.contains("dark-mode")) {
                localStorage.setItem("darkMode", "enabled");
                darkModeToggle.textContent = "☀️ Light Mode";
            } else {
                localStorage.setItem("darkMode", "disabled");
                darkModeToggle.textContent = "🌙 Dark Mode";
            }
        });
    </script>
</body>
</html>
